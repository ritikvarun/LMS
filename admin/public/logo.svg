<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="codecrafters-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="inner-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Base Tile -->
  <rect width="64" height="64" rx="16" fill="url(#codecrafters-grad)" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#inner-glow)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
  
  <!-- Crafting Brackets Code Symbol < / > -->
  <!-- Left Bracket < -->
  <path d="M25 21L15 32L25 43" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Forward Slash / -->
  <path d="M36 19L28 45" stroke="#FDE047" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Right Bracket > -->
  <path d="M39 21L49 32L39 43" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Center Spark Dot -->
  <circle cx="48" cy="18" r="3" fill="#38BDF8" />
</svg>
